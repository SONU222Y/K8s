apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: study-planner
  labels:
    app.kubernetes.io/name: study-planner
    app.kubernetes.io/instance: study-planner
    app.kubernetes.io/part-of: study-planner
  annotations:
    # The AI pipeline can take up to a minute; keep the proxy from timing out.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
spec:
  ingressClassName: nginx
  rules:
    - host: study-planner.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: study-planner
                port:
                  name: http
