# EXAMPLE ONLY. Do NOT commit real API keys.
# Copy this file (e.g. to secret.yaml, which you should git-ignore), put your real
# key in it, and `kubectl apply -f` it. This file is intentionally NOT listed in
# kustomization.yaml. Or skip the file entirely:
#   kubectl -n study-planner create secret generic study-planner-secrets \
#     --from-literal=ANTHROPIC_API_KEY='sk-ant-...'
apiVersion: v1
kind: Secret
metadata:
  name: study-planner-secrets
  namespace: study-planner
type: Opaque
stringData:
  ANTHROPIC_API_KEY: "REPLACE_ME"
