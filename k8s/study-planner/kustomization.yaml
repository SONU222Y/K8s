apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: study-planner
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml
  - networkpolicy.yaml
# secret.example.yaml is deliberately excluded; create the real Secret yourself.
# Adds labels to metadata only (includeSelectors: false keeps selectors stable).
labels:
  - pairs:
      app.kubernetes.io/managed-by: kustomize
      app.kubernetes.io/part-of: study-planner
    includeSelectors: false
