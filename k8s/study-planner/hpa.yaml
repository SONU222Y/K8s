apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: study-planner
  labels:
    app.kubernetes.io/name: study-planner
    app.kubernetes.io/instance: study-planner
    app.kubernetes.io/part-of: study-planner
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: study-planner
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
